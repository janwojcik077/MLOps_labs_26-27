[project]
name = "mlops-labs-26-27"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jan Wójcik", email = "jan.wojcik077@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "clean-text>=0.7.1",
    "fastapi>=0.143.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pre-commit>=4.6.2",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
mlops-labs-26-27 = "mlops_labs_26_27:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-dotenv>=0.5.2",
]

[tool.mypy]
explicit_package_bases = true
mypy_path = "."
